<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow | Modern Project & Task Hub{% endblock %}</title>
    
    <!-- Tailwind CSS (via official Tailwind Play CDN with plugins) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            200: '#c7d2fe',
                            300: '#a5b4fc',
                            400: '#818cf8',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                            800: '#3730a3',
                            900: '#312e81',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col antialiased">
    
    <!-- Navigation Bar -->
    {% include 'includes/navbar.html' %}

    <!-- Alert Messages -->
    {% include 'includes/messages.html' %}

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white/70 dark:bg-slate-900/70 backdrop-blur py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
            <div class="flex items-center space-x-2">
                <span class="inline-flex items-center justify-center h-6 w-6 rounded-lg bg-indigo-600 text-white font-bold text-xs">TF</span>
                <span class="font-semibold text-slate-700 dark:text-slate-300">TaskFlow Hub</span>
                <span>&bull; Python Django + Tailwind CSS</span>
            </div>
            <div class="flex items-center space-x-4">
                <a href="{% url 'tasks:export_csv' %}" class="hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center gap-1">
                    <i class="fa-solid fa-file-csv"></i> Export CSV
                </a>
                <a href="{% url 'tasks:export_json' %}" class="hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center gap-1">
                    <i class="fa-solid fa-code"></i> Export JSON
                </a>
                <a href="/admin/" class="hover:text-indigo-600 dark:hover:text-indigo-400 flex items-center gap-1">
                    <i class="fa-solid fa-shield-halved"></i> Admin
                </a>
            </div>
        </div>
    </footer>

    <!-- Custom Scripts -->
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
