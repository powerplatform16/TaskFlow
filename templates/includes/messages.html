{% if messages %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-4 space-y-2">
    {% for message in messages %}
    <div class="alert-toast flex items-center justify-between p-4 rounded-xl border {{ message.tags }} shadow-sm transition-all duration-300 transform" role="alert">
        <div class="flex items-center space-x-3">
            <span class="text-base">
                {% if 'emerald' in message.tags or 'success' in message.tags %}
                    <i class="fa-solid fa-circle-check"></i>
                {% elif 'rose' in message.tags or 'error' in message.tags %}
                    <i class="fa-solid fa-circle-exclamation"></i>
                {% elif 'amber' in message.tags or 'warning' in message.tags %}
                    <i class="fa-solid fa-triangle-exclamation"></i>
                {% else %}
                    <i class="fa-solid fa-circle-info"></i>
                {% endif %}
            </span>
            <div class="text-sm font-medium">{{ message }}</div>
        </div>
        <button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition focus:outline-none">
            <i class="fa-solid fa-xmark text-sm"></i>
        </button>
    </div>
    {% endfor %}
</div>
{% endif %}
